server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: cityseek-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cityseek?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
mybatis-plus:
  type-aliases-package: com.cityseek.entity
logging:
  level:
    com.cityseek: ${APP_LOG_LEVEL:info}
app:
  upload-dir: ${IMAGE_UPLOAD_DIR:./data/images}
  redis:
    initialize-cache: ${REDIS_INITIALIZE_CACHE:true}
    stream-consumer: ${REDIS_STREAM_CONSUMER:cityseek-consumer}
    pending-min-idle: ${REDIS_PENDING_MIN_IDLE:30s}
    pending-recovery-interval: ${REDIS_PENDING_RECOVERY_INTERVAL:5s}
    pending-batch-size: ${REDIS_PENDING_BATCH_SIZE:20}
    dlq-max-length: ${REDIS_DLQ_MAX_LENGTH:10000}
    stream-metrics-interval: ${REDIS_STREAM_METRICS_INTERVAL:10s}
    pending-warning-age: ${REDIS_PENDING_WARNING_AGE:60s}
  feed:
    outbox:
      enabled: ${FEED_OUTBOX_ENABLED:true}
      poll-interval: ${FEED_OUTBOX_POLL_INTERVAL:1000}
      batch-size: ${FEED_OUTBOX_BATCH_SIZE:10}
      follower-batch-size: ${FEED_FOLLOWER_BATCH_SIZE:200}
      lease-duration: ${FEED_OUTBOX_LEASE_DURATION:30s}
      max-retries: ${FEED_OUTBOX_MAX_RETRIES:5}
