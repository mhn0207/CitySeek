server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: cityseek-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cityseek?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.cityseek.entity
logging:
  level:
    com.cityseek: ${APP_LOG_LEVEL:info}
app:
  upload-dir: ${IMAGE_UPLOAD_DIR:./data/images}
  redis:
    initialize-cache: ${REDIS_INITIALIZE_CACHE:true}
    stream-consumer: ${REDIS_STREAM_CONSUMER:cityseek-consumer}
    pending-min-idle: ${REDIS_PENDING_MIN_IDLE:30s}
    pending-recovery-interval: ${REDIS_PENDING_RECOVERY_INTERVAL:5s}
    pending-batch-size: ${REDIS_PENDING_BATCH_SIZE:20}
    dlq-max-length: ${REDIS_DLQ_MAX_LENGTH:10000}
