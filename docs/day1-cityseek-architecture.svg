<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CitySeek 总体架构图</title>
  <desc id="desc">Vue 前端通过 Nginx 访问 Spring Boot，后端连接 MySQL、Redis 和本地文件存储。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effcf6"/>
      <stop offset="1" stop-color="#dcf7eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20304a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#526681"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #152238; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #607089; }
      .box-title { font: 700 21px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #17243a; }
      .box-text { font: 400 15px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #46566e; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #526681; }
      .tag { font: 600 13px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #31546f; }
      .arrow-label { font: 600 13px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #46566e; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <text x="62" y="62" class="title">CitySeek 总体架构</text>
  <text x="62" y="92" class="subtitle">本地生活发现、社交内容与高并发优惠券秒杀平台</text>

  <g filter="url(#shadow)">
    <rect x="54" y="235" width="250" height="170" rx="20" fill="#ffffff" stroke="#b9c9e6" stroke-width="2"/>
    <circle cx="91" cy="274" r="16" fill="#5d7ce2"/>
    <text x="122" y="282" class="box-title">浏览器 / 前端</text>
    <text x="82" y="326" class="box-text">Vue 2 · Element UI · Axios</text>
    <text x="82" y="356" class="box-text">静态页面、交互与 API 调用</text>
    <rect x="82" y="374" width="122" height="24" rx="12" fill="#edf2ff"/>
    <text x="97" y="391" class="tag">localhost:8080</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="235" width="220" height="170" rx="20" fill="#fff8e8" stroke="#e6c979" stroke-width="2"/>
    <circle cx="408" cy="274" r="16" fill="#e2a93b"/>
    <text x="439" y="282" class="box-title">Nginx</text>
    <text x="400" y="326" class="box-text">静态资源托管</text>
    <text x="400" y="356" class="box-text">反向代理 /api、/blogs</text>
    <rect x="400" y="374" width="117" height="24" rx="12" fill="#fff0c7"/>
    <text x="415" y="391" class="tag">Nginx 1.18</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="128" width="390" height="468" rx="24" fill="url(#app)" stroke="#79c6a3" stroke-width="2"/>
    <text x="689" y="171" class="box-title">Spring Boot :8081</text>
    <text x="689" y="196" class="small">Java 17 · Spring Boot 3.4.4 · MyBatis-Plus</text>

    <rect x="687" y="220" width="326" height="58" rx="13" fill="#ffffff" stroke="#b6dec9"/>
    <text x="710" y="246" class="tag">请求入口与鉴权</text>
    <text x="710" y="266" class="small">RefreshToken / Login / Role Interceptor</text>

    <rect x="687" y="294" width="326" height="68" rx="13" fill="#ffffff" stroke="#b6dec9"/>
    <text x="710" y="321" class="tag">Controller</text>
    <text x="710" y="343" class="small">用户 · 商铺 · 笔记 · 关注 · 优惠券 · 上传</text>

    <rect x="687" y="378" width="326" height="82" rx="13" fill="#ffffff" stroke="#b6dec9"/>
    <text x="710" y="405" class="tag">Service / 核心业务</text>
    <text x="710" y="427" class="small">缓存穿透 · GEO · 点赞/Feed · 签到 · 秒杀</text>
    <text x="710" y="448" class="small">事务、RBAC、上传文件所有权</text>

    <rect x="687" y="476" width="326" height="88" rx="13" fill="#ffffff" stroke="#b6dec9"/>
    <text x="710" y="503" class="tag">数据与异步支撑</text>
    <text x="710" y="525" class="small">Mapper · CacheClient · Lua · Redisson</text>
    <text x="710" y="546" class="small">Redis Stream Consumer · Outbox Worker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="108" width="250" height="132" rx="20" fill="#eef6ff" stroke="#79aee6" stroke-width="2"/>
    <circle cx="1167" cy="145" r="16" fill="#4b92d9"/>
    <text x="1198" y="153" class="box-title">MySQL 8</text>
    <text x="1160" y="190" class="box-text">持久化业务事实与事务</text>
    <text x="1160" y="216" class="small">12 张表 · 本次映射 3307</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="286" width="250" height="176" rx="20" fill="#fff0f1" stroke="#e6868e" stroke-width="2"/>
    <circle cx="1167" cy="324" r="16" fill="#d94e59"/>
    <text x="1198" y="332" class="box-title">Redis 7.2</text>
    <text x="1160" y="370" class="box-text">缓存 · Token · Bitmap · GEO</text>
    <text x="1160" y="398" class="box-text">Set / ZSet · 秒杀库存</text>
    <text x="1160" y="426" class="box-text">Stream · 分布式锁</text>
    <text x="1160" y="449" class="small">localhost:6379</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="508" width="250" height="124" rx="20" fill="#f7f1ff" stroke="#aa8bd9" stroke-width="2"/>
    <circle cx="1167" cy="545" r="16" fill="#8f68c9"/>
    <text x="1198" y="553" class="box-title">文件存储</text>
    <text x="1160" y="590" class="box-text">本地图片目录</text>
    <text x="1160" y="614" class="small">./data/images · /blogs/**</text>
  </g>

  <path d="M304 320 L370 320" fill="none" stroke="#526681" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="316" y="303" class="arrow-label">HTTP</text>
  <path d="M590 320 L655 320" fill="none" stroke="#526681" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="303" class="arrow-label">/api/*</text>

  <path d="M1045 216 C1080 216 1088 174 1130 174" fill="none" stroke="#526681" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1059" y="176" class="arrow-label">SQL / 事务</text>
  <path d="M1045 365 L1130 365" fill="none" stroke="#526681" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1057" y="347" class="arrow-label">缓存/消息</text>
  <path d="M1045 520 C1080 520 1088 570 1130 570" fill="none" stroke="#526681" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1056" y="557" class="arrow-label">图片读写</text>

  <rect x="54" y="694" width="1326" height="70" rx="18" fill="#ffffff" stroke="#d7e0ee"/>
  <circle cx="89" cy="729" r="9" fill="#2ab673"/>
  <text x="112" y="725" class="tag">第 1 天实测通过</text>
  <text x="112" y="748" class="small">Nginx 首页 200 · 代理商铺查询 200 · Spring Boot Health UP · Redis PONG · MySQL 12 表已导入</text>
</svg>
